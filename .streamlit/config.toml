[server]
# 本地开发：localhost 即可；部署时改为 0.0.0.0
address = "localhost"
# 本地设为 false 自动打开浏览器；部署时改为 true
headless = false
port = 8501

[browser]
serverAddress = "localhost"
gatherUsageStats = false

[theme]
primaryColor = "#C17B4A"
backgroundColor = "#FAF7F4"
secondaryBackgroundColor = "#F5F0EB"
textColor = "#3D2E28"
font = "sans serif"
